<!doctype html>
<html lang="en">
  <head>
    <script>
      // 1. Silent mock for Vite HMR WebSocket to completely eliminate benign disconnect errors
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isVite = (protocols === 'vite-hmr') || 
                         (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                         (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('token=') !== -1));
            if (isVite) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // WebSocket.OPEN
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = url;
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch(e) {}
              }, 10);
              return target;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING || 0;
          window.WebSocket.OPEN = OrigWS.OPEN || 1;
          window.WebSocket.CLOSING = OrigWS.CLOSING || 2;
          window.WebSocket.CLOSED = OrigWS.CLOSED || 3;
        }

        // 2. Filter console.error and unhandledrejection for Vite HMR messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String(a || ''); }).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('closed without opened') !== -1) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var suppress = function(e) {
          var reason = e.reason;
          var msg = ((reason ? (reason.message || reason) : '') || e.message || '').toString();
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('HMR') !== -1 || msg.indexOf('closed without opened') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            return true;
          }
        };

        window.addEventListener('unhandledrejection', suppress, true);
        window.addEventListener('error', suppress, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="SPLENDOUR | Premium Streetwear Architecture. Defined by culture, crafted for luxury. High-end urban apparel from the heart of Dhaka." />
    
    <!-- Privacy & Security -->
    <meta name="referrer" content="no-referrer" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>S</text></svg>" />

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://picsum.photos" />
    
    <title>SPLENDOUR | Premium Streetwear Architecture</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
